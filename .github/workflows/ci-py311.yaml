name: CI Python 3.11

on: [push, pull_request]

defaults:
  run:
    shell: bash

jobs:
  run:
    name: py3.11-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Create virtual environment
        run: uv venv .venv

      - name: Install dependencies
        run: |
          uv pip install numba numpy
          uv pip install -r test_requirements.txt

      - name: Run tests and collect coverage
        env:
          PYTHONPATH: src
        run: uv run pytest --mpl --mpl-baseline-path="test/baseline_images" --cov src

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v3
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Build wheel
        run: |
          uv pip install build setuptools wheel setuptools-scm
          uv run python -m build --wheel --outdir dist --no-isolation

      - name: Verify built wheel import
        run: |
          uv pip install --force-reinstall --no-deps dist/*.whl
          uv run python -c "import easyclimate as ecl; print(ecl.__version__)"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: easyclimate-py311-${{ matrix.os }}-wheel
          path: dist/*.whl
          if-no-files-found: error
