name: CI Python 3.10

on: [push, pull_request]

defaults:
  run:
    shell: bash

jobs:
  run:
    name: py3.10-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Create virtual environment
        run: uv venv .venv

      - name: Install dependencies
        run: |
          uv pip install numba numpy
          uv pip install -r test_requirements.txt

      - name: Print backend status
        env:
          PYTHONPATH: src
        run: |
          uv run --no-sync python - <<'PY'
          import easyclimate.backend as b
          names = [
              "spharm", "VectorWind", "aeronoskin", "aeroskin",
              "human_index_mod", "_ecl_redfit", "_ecl_redfit_x",
              "_vinth2p_dp", "_vinth2p_ecmwf", "_vintp2p_ecmwf",
              "dvibeta_ncl", "ddvfidf_ncl", "dvrfidf_ncl",
          ]
          print("backend platform:", b.CURRENT_PLATFORM)
          for name in names:
              value = getattr(b, name, None)
              print(f"{name}: {value is not None} ({type(value).__name__})")
          PY

      - name: Run tests and collect coverage
        env:
          PYTHONPATH: src
        run: uv run --no-sync pytest --mpl --mpl-baseline-path="test/baseline_images" --cov src

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v3
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Build wheel
        run: |
          uv pip install build setuptools wheel setuptools-scm
          uv run --no-sync python -m build --wheel --outdir dist --no-isolation

      - name: Verify built wheel import
        run: |
          uv pip install --force-reinstall --no-deps dist/*.whl
          uv run --no-sync python -c "import easyclimate as ecl; print(ecl.__version__)"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: easyclimate-py310-${{ matrix.os }}-wheel
          path: dist/*.whl
          if-no-files-found: error
